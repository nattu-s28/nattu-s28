<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" text-rendering="geometricPrecision" shape-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap');
      .title { font-family: 'Orbitron', 'Courier New', monospace; }
      .label { font-family: 'Rajdhani', Arial, sans-serif; }
    </style>
    <linearGradient id="coreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="pcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="pcGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2a0000" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="6" fill="url(#coreBg)"/>
  <rect width="1200" height="300" rx="6" fill="url(#pcGrid)"/>
  <rect x="3" y="3" width="1194" height="294" rx="5" fill="none" stroke="#FF1A1A" stroke-width="1.4" opacity="0.55"/>
  <rect x="10" y="10" width="1180" height="280" rx="4" fill="none" stroke="#FF1A1A" stroke-width="0.5" opacity="0.25"/>

  <g stroke="#FF3030" stroke-width="2" opacity="0.8">
    <path d="M10,30 L10,10 L30,10" fill="none"/>
    <path d="M1170,10 L1190,10 L1190,30" fill="none"/>
    <path d="M1190,270 L1190,290 L1170,290" fill="none"/>
    <path d="M30,290 L10,290 L10,270" fill="none"/>
  </g>

  <text class="title" x="40" y="48" font-size="21" font-weight="700" letter-spacing="3" fill="#FF3030" filter="url(#pcGlow)">NATTU // PROFILE CORE</text>
  <line x1="40" y1="62" x2="1160" y2="62" stroke="#FF1A1A" stroke-width="1" opacity="0.4"/>

  <circle cx="1140" cy="45" r="6" fill="#FF2020">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text class="label" x="1120" y="49" text-anchor="end" font-weight="700" font-size="14" fill="#FF5050">ONLINE</text>

  <g class="label" font-size="16" font-weight="600">
    <text x="40" y="100" fill="#B22222" letter-spacing="2">IDENTITY</text>
    <text x="260" y="100" fill="#FFEAEA">NATARAJAN V  ["NATTU"]</text>

    <text x="40" y="132" fill="#B22222" letter-spacing="2">DOMAIN</text>
    <text x="260" y="132" fill="#FFEAEA">Artificial Intelligence &amp; Data Science</text>

    <text x="40" y="164" fill="#B22222" letter-spacing="2">CURRENT MODE</text>
    <text x="260" y="164" fill="#FFEAEA">AI &amp; DS Student — Future AI / ML Engineer</text>

    <text x="40" y="196" fill="#B22222" letter-spacing="2">FOCUS</text>
    <text x="260" y="196" fill="#FFEAEA">Machine Learning • Deep Learning • DSA</text>

    <text x="40" y="228" fill="#B22222" letter-spacing="2">MISSION</text>
    <text x="260" y="228" fill="#FFEAEA">"Consistency is the Key to Success"</text>

    <text x="40" y="260" fill="#B22222" letter-spacing="2">STATUS</text>
    <text x="260" y="260" fill="#FF3030" font-weight="700">ONLINE • BUILDING • LEARNING</text>
  </g>

  <rect x="0" y="0" width="4" height="300" fill="#FF0000" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
