<svg width="1200" height="110" viewBox="0 0 1200 110" xmlns="http://www.w3.org/2000/svg" text-rendering="geometricPrecision" shape-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap');
      .title { font-family: 'Orbitron', 'Courier New', monospace; }
      .label { font-family: 'Rajdhani', Arial, sans-serif; }
    </style>
    <linearGradient id="lcBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#150000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="lcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="110" fill="url(#lcBg)"/>
  <rect x="2" y="2" width="1196" height="106" fill="none" stroke="#FF1A1A" stroke-width="1" opacity="0.4"/>

  <g stroke="#FF2020" stroke-width="2" fill="none" opacity="0.8">
    <path d="M4,26 L4,4 L26,4"/>
    <path d="M1174,4 L1196,4 L1196,26"/>
    <path d="M1196,84 L1196,106 L1174,106"/>
    <path d="M26,106 L4,106 L4,84"/>
  </g>

  <text class="title" x="600" y="55" text-anchor="middle" font-size="30" font-weight="900" letter-spacing="6" fill="#FF2020" filter="url(#lcGlow)">LEETCODE // COMMAND CENTER</text>
  <text class="label" x="600" y="82" text-anchor="middle" font-weight="600" font-size="13" letter-spacing="4" fill="#B22222">CODING INTELLIGENCE &amp; PROBLEM-SOLVING TELEMETRY</text>

  <rect x="0" y="0" width="1200" height="3" fill="#FF0000" opacity="0.4">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
