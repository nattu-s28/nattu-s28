<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" text-rendering="geometricPrecision" shape-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap');
      .title { font-family: 'Orbitron', 'Courier New', monospace; }
      .label { font-family: 'Rajdhani', Arial, sans-serif; }
    </style>
    <radialGradient id="footBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#140000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="footGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FF2020" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#footBg)"/>
  <rect x="4" y="4" width="1192" height="212" fill="none" stroke="#FF1A1A" stroke-width="1" opacity="0.3"/>

  <circle cx="600" cy="90" r="10" fill="none" stroke="#FF2020" stroke-width="2" opacity="0.8">
    <animate attributeName="r" values="10;90;10" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="90" r="10" fill="none" stroke="#FF4040" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="10;60;10" dur="4s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <path d="M100,140 L250,140 L280,110 L310,170 L340,90 L370,150 L400,140 L1100,140" fill="none" stroke="url(#waveGrad)" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <text class="title" x="600" y="98" text-anchor="middle" font-size="26" font-weight="900" letter-spacing="10" fill="#FF2020" filter="url(#footGlow)">NATTU</text>

  <text class="label" x="600" y="180" text-anchor="middle" font-weight="700" font-size="14" letter-spacing="4" fill="#B22222">
    TRANSMISSION ENDING
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <text class="label" x="600" y="204" text-anchor="middle" font-weight="500" font-size="13" letter-spacing="2" fill="#661111">Consistency is the Key to Success</text>
</svg>
