<svg width="1000" height="14" viewBox="0 0 1000 14" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D0000"/>
      <stop offset="45%" stop-color="#8B0000"/>
      <stop offset="50%" stop-color="#FF3B3B"/>
      <stop offset="55%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#0D0000"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="1000" height="2" fill="#3a0000"/>
  <rect x="-300" y="4" width="300" height="6" fill="url(#flow)" filter="url(#g)">
    <animate attributeName="x" values="-300;1000" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
