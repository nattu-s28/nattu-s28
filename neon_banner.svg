<svg width="1000" height="180" viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1E1E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1E1E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF1E1E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="180" fill="#050000"/>

  <!-- grid lines -->
  <g stroke="#3a0000" stroke-width="1" opacity="0.5">
    <line x1="0" y1="45" x2="1000" y2="45"/>
    <line x1="0" y1="90" x2="1000" y2="90"/>
    <line x1="0" y1="135" x2="1000" y2="135"/>
  </g>

  <!-- pulsing core dot left -->
  <circle cx="60" cy="90" r="8" fill="#FF1E1E" filter="url(#glow)">
    <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- glowing title text -->
  <text x="500" y="100" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="56" font-weight="700" letter-spacing="4" fill="#FF3B3B" filter="url(#glow)">
    NATTU
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="128" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#B84040" letter-spacing="3">
    AI &amp; DS STUDENT
  </text>

  <!-- scanning beam -->
  <rect x="-200" y="0" width="200" height="180" fill="url(#scan)">
    <animate attributeName="x" values="-200;1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom neon rule -->
  <rect x="0" y="170" width="1000" height="3" fill="#FF1E1E" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </rect>
</svg>
