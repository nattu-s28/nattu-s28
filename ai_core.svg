<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="220" height="220" fill="#050000"/>

  <g transform="translate(110,110)">
    <!-- rotating outer ring, dashed -->
    <circle r="90" fill="none" stroke="#8B0000" stroke-width="2" stroke-dasharray="8 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- counter-rotating ring -->
    <circle r="68" fill="none" stroke="#FF1E1E" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- pulsing core -->
    <circle r="34" fill="#8B0000" opacity="0.5" filter="url(#glow)">
      <animate attributeName="r" values="30;40;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.65;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#FF3B3B" filter="url(#glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
